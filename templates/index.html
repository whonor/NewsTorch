<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsTorch - Model Training Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-dev {
            background-color: #9b59b6;
        }
        .btn-dev:hover {
            background-color: #8e44ad;
        }
        .btn-test {
            background-color: #2ecc71;
        }
        .btn-test:hover {
            background-color: #27ae60;
        }
        .btn-download {
            background-color: #f39c12;
        }
        .btn-download:hover {
            background-color: #d35400;
        }
        .btn-prepare {
            background-color: #e67e22;
        }
        .btn-prepare:hover {
            background-color: #d35400;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .result.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .mode-selector {
            display: flex;
            margin-bottom: 20px;
        }
        .mode-selector button {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #ecf0f1;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .mode-selector button.active {
            background-color: #3498db;
            color: white;
        }
        .mode-content {
            display: none;
        }
        .mode-content.active {
            display: block;
        }
        .task-log {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .log-entry {
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .log-entry.error {
            color: #dc3545;
            font-weight: bold;
        }
        .log-entry.success {
            color: #28a745;
        }
        .log-entry.info {
            color: #17a2b8;
        }
        .dataset-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
        }
        .dataset-section h3 {
            margin-top: 0;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NewsTorch Model Training Platform</h1>
        
        <div class="mode-selector">
            <button id="train-mode" class="active">Train</button>
            <button id="dev-mode">Validate</button>
            <button id="test-mode">Test</button>
        </div>
        
        <form id="train-form" class="mode-content active">
            <div class="form-group">
                <label for="train-model">Select Model:</label>
                <select id="train-model" name="model" required>
                    <option value="">Please select a model</option>
                    {% for model in form.model.choices %}
                        <option value="{{ model[0] }}">{{ model[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="batch-size">Batch Size:</label>
                <input type="number" id="batch-size" name="batch_size" value="64" min="1" required>
            </div>
            <div class="form-group">
                <label for="epoch">Epoch:</label>
                <input type="number" id="epoch" name="epoch" value="10" min="1" required>
            </div>
            <div class="form-group">
                <label for="dataset-root">Dataset Root (DATASET_ROOT):</label>
                <select id="dataset-root" name="dataset_root" required>
                    <option value="MIND-small" selected>MIND-small</option>
                    <option value="MIND-large">MIND-large</option>
                    <option value="ebnerd_demo">ebnerd_demo</option>
                    <option value="ebnerd_small">ebnerd_small</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dataset-name">Dataset Name (dataset_name):</label>
                <select id="dataset-name" name="dataset_name" required>
                    <option value="MIND" selected>MIND</option>
                    <option value="ebnerd">ebnerd</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dataset-size">Dataset Size (dataset_size):</label>
                <select id="dataset-size" name="dataset_size" required>
                    <option value="small" selected>small</option>
                    <option value="large">large</option>
                    <option value="demo">demo</option>
                    <option value="submission">submission</option>
                </select>
            </div>
            <button type="submit" class="btn">Start Training</button>
        </form>
        
        <form id="dev-form" class="mode-content">
            <div class="form-group">
                <label for="dev-model">Select Model:</label>
                <select id="dev-model" name="model" required>
                    <option value="">Please select a model</option>
                    {% for model in form.model.choices %}
                        <option value="{{ model[0] }}">{{ model[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="dev-model-path">Model Path:</label>
                <input type="text" id="dev-model-path" name="dev_model_path" placeholder="Please enter model path" required>
            </div>
            <div class="form-group">
                <label for="dev-dataset-root">Dataset Root (DATASET_ROOT):</label>
                <select id="dev-dataset-root" name="dataset_root" required>
                    <option value="MIND-small" selected>MIND-small</option>
                    <option value="MIND-large">MIND-large</option>
                    <option value="ebnerd_demo">ebnerd_demo</option>
                    <option value="ebnerd_small">ebnerd_small</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dev-dataset-name">Dataset Name (dataset_name):</label>
                <select id="dev-dataset-name" name="dataset_name" required>
                    <option value="MIND" selected>MIND</option>
                    <option value="ebnerd">ebnerd</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dev-dataset-size">Dataset Size (dataset_size):</label>
                <select id="dev-dataset-size" name="dataset_size" required>
                    <option value="small" selected>small</option>
                    <option value="large">large</option>
                    <option value="demo">demo</option>
                    <option value="submission">submission</option>
                </select>
            </div>
            <button type="submit" class="btn btn-dev">Start Validation</button>
        </form>
        
        <form id="test-form" class="mode-content">
            <div class="form-group">
                <label for="test-model">Select Model:</label>
                <select id="test-model" name="model" required>
                    <option value="">Please select a model</option>
                    {% for model in form.model.choices %}
                        <option value="{{ model[0] }}">{{ model[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="test-model-path">Model Path:</label>
                <input type="text" id="test-model-path" name="test_model_path" placeholder="Please enter model path" required>
            </div>
            <div class="form-group">
                <label for="test-dataset-root">Dataset Root (DATASET_ROOT):</label>
                <select id="test-dataset-root" name="dataset_root" required>
                    <option value="MIND-small" selected>MIND-small</option>
                    <option value="MIND-large">MIND-large</option>
                    <option value="ebnerd_demo">ebnerd_demo</option>
                    <option value="ebnerd_small">ebnerd_small</option>
                </select>
            </div>
            <div class="form-group">
                <label for="test-dataset-name">Dataset Name (dataset_name):</label>
                <select id="test-dataset-name" name="dataset_name" required>
                    <option value="MIND" selected>MIND</option>
                    <option value="ebnerd">ebnerd</option>
                </select>
            </div>
            <div class="form-group">
                <label for="test-dataset-size">Dataset Size (dataset_size):</label>
                <select id="test-dataset-size" name="dataset_size" required>
                    <option value="small" selected>small</option>
                    <option value="large">large</option>
                    <option value="demo">demo</option>
                    <option value="submission">submission</option>
                </select>
            </div>
            <button type="submit" class="btn btn-test">Start Testing</button>
        </form>
        
        <div class="dataset-section">
            <h3>Dataset Management</h3>
            <div class="form-group">
                <label for="dataset-manager">Select Dataset:</label>
                <select id="dataset-manager" name="dataset">
                    <option value="">Please select a dataset</option>
                    {% for dataset in form.dataset.choices %}
                        <option value="{{ dataset[0] }}">{{ dataset[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <button id="download-btn" class="btn btn-download">Download Dataset</button>
            <button id="prepare-btn" class="btn btn-prepare">Process Dataset</button>
        </div>
        
        <div id="result" class="result"></div>
        <div id="task-log" class="task-log"></div>
    </div>

    <script>
        // Mode switching
        document.getElementById('train-mode').addEventListener('click', function() {
            setActiveMode('train');
        });
        
        document.getElementById('dev-mode').addEventListener('click', function() {
            setActiveMode('dev');
        });
        
        document.getElementById('test-mode').addEventListener('click', function() {
            setActiveMode('test');
        });
        
        function setActiveMode(mode) {
            // Update button state
            document.querySelectorAll('.mode-selector button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(mode + '-mode').classList.add('active');
            
            // Show corresponding form
            document.querySelectorAll('.mode-content').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(mode + '-form').classList.add('active');
        }
        
        // Form submission handling
        document.getElementById('train-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const model = document.getElementById('train-model').value;
            const batch_size = document.getElementById('batch-size').value;
            const epoch = document.getElementById('epoch').value;
            const dataset_root = document.getElementById('dataset-root').value;
            const dataset_name = document.getElementById('dataset-name').value;
            const dataset_size = document.getElementById('dataset-size').value;
            
            if (!model) {
                showResult('Please select a model first', 'error');
                return;
            }
            
            // Clear log and show
            clearLog();
            showLog();
            addLogEntry('Starting training task...', 'info');
            
            // Send request to server
            fetch(`/train?model=${encodeURIComponent(model)}&batch_size=${batch_size}&epoch=${epoch}&dataset_root=${encodeURIComponent(dataset_root)}&dataset_name=${encodeURIComponent(dataset_name)}&dataset_size=${encodeURIComponent(dataset_size)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'started') {
                        showResult(data.message, 'success');
                        addLogEntry(data.message, 'success');
                        addLogEntry('Training task started in background. Please check console output for detailed progress.', 'info');
                    } else {
                        showResult(data.message || 'Error starting training task', 'error');
                        addLogEntry(data.message || 'Error starting training task', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showResult(`Error occurred: ${error.message}`, 'error');
                    addLogEntry(`Error occurred: ${error.message}`, 'error');
                });
        });
        
        document.getElementById('dev-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const model = document.getElementById('dev-model').value;
            const dev_model_path = document.getElementById('dev-model-path').value;
            const dataset_root = document.getElementById('dev-dataset-root').value;
            const dataset_name = document.getElementById('dev-dataset-name').value;
            const dataset_size = document.getElementById('dev-dataset-size').value;
            
            if (!model || !dev_model_path) {
                showResult('Please fill in all required fields', 'error');
                return;
            }
            
            // Clear log and show
            clearLog();
            showLog();
            addLogEntry('Starting validation task...', 'info');
            
            // Send request to server
            fetch(`/dev?model=${encodeURIComponent(model)}&dev_model_path=${encodeURIComponent(dev_model_path)}&dataset_root=${encodeURIComponent(dataset_root)}&dataset_name=${encodeURIComponent(dataset_name)}&dataset_size=${encodeURIComponent(dataset_size)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'started') {
                        showResult(data.message, 'success');
                        addLogEntry(data.message, 'success');
                        addLogEntry('Validation task started in background. Please check console output for detailed progress.', 'info');
                    } else {
                        showResult(data.message || 'Error starting validation task', 'error');
                        addLogEntry(data.message || 'Error starting validation task', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showResult(`Error occurred: ${error.message}`, 'error');
                    addLogEntry(`Error occurred: ${error.message}`, 'error');
                });
        });
        
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const model = document.getElementById('test-model').value;
            const test_model_path = document.getElementById('test-model-path').value;
            const dataset_root = document.getElementById('test-dataset-root').value;
            const dataset_name = document.getElementById('test-dataset-name').value;
            const dataset_size = document.getElementById('test-dataset-size').value;
            
            if (!model || !test_model_path) {
                showResult('Please fill in all required fields', 'error');
                return;
            }
            
            // Clear log and show
            clearLog();
            showLog();
            addLogEntry('Starting test task...', 'info');
            
            // Send request to server
            fetch(`/test?model=${encodeURIComponent(model)}&test_model_path=${encodeURIComponent(test_model_path)}&dataset_root=${encodeURIComponent(dataset_root)}&dataset_name=${encodeURIComponent(dataset_name)}&dataset_size=${encodeURIComponent(dataset_size)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'started') {
                        showResult(data.message, 'success');
                        addLogEntry(data.message, 'success');
                        addLogEntry('Test task started in background. Please check console output for detailed progress.', 'info');
                    } else {
                        showResult(data.message || 'Error starting test task', 'error');
                        addLogEntry(data.message || 'Error starting test task', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showResult(`Error occurred: ${error.message}`, 'error');
                    addLogEntry(`Error occurred: ${error.message}`, 'error');
                });
        });
        
        // Dataset management functions
        document.getElementById('download-btn').addEventListener('click', function() {
            const dataset = document.getElementById('dataset-manager').value;
            const dataset_root = document.getElementById('dataset-root').value;
            const dataset_name = document.getElementById('dataset-name').value;
            const dataset_size = document.getElementById('dataset-size').value;
            
            if (!dataset) {
                showResult('Please select a dataset to download', 'error');
                return;
            }
            
            // Clear log and show
            clearLog();
            showLog();
            addLogEntry(`Starting dataset ${dataset} download task...`, 'info');
            
            // Send request to server
            fetch(`/download_dataset?dataset=${encodeURIComponent(dataset)}&dataset_root=${encodeURIComponent(dataset_root)}&dataset_name=${encodeURIComponent(dataset_name)}&dataset_size=${encodeURIComponent(dataset_size)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'started') {
                        showResult(data.message, 'success');
                        addLogEntry(data.message, 'success');
                    } else {
                        showResult(data.message || 'Error starting dataset download task', 'error');
                        addLogEntry(data.message || 'Error starting dataset download task', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showResult(`Error occurred: ${error.message}`, 'error');
                    addLogEntry(`Error occurred: ${error.message}`, 'error');
                });
        });
        
        document.getElementById('prepare-btn').addEventListener('click', function() {
            const dataset = document.getElementById('dataset-manager').value;
            const dataset_root = document.getElementById('dataset-root').value;
            const dataset_name = document.getElementById('dataset-name').value;
            const dataset_size = document.getElementById('dataset-size').value;
            
            if (!dataset) {
                showResult('Please select a dataset to process', 'error');
                return;
            }
            
            // Clear log and show
            clearLog();
            showLog();
            addLogEntry(`Starting dataset ${dataset} processing task...`, 'info');
            
            // Send request to server
            fetch(`/prepare_dataset?dataset=${encodeURIComponent(dataset)}&dataset_root=${encodeURIComponent(dataset_root)}&dataset_name=${encodeURIComponent(dataset_name)}&dataset_size=${encodeURIComponent(dataset_size)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'started') {
                        showResult(data.message, 'success');
                        addLogEntry(data.message, 'success');
                    } else {
                        showResult(data.message || 'Error starting dataset processing task', 'error');
                        addLogEntry(data.message || 'Error starting dataset processing task', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showResult(`Error occurred: ${error.message}`, 'error');
                    addLogEntry(`Error occurred: ${error.message}`, 'error');
                });
        });
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = 'result ' + type;
            resultDiv.style.display = 'block';
            
            // Hide result after 5 seconds
            setTimeout(() => {
                resultDiv.style.display = 'none';
            }, 5000);
        }
        
        function showLog() {
            const logDiv = document.getElementById('task-log');
            logDiv.style.display = 'block';
        }
        
        function clearLog() {
            const logDiv = document.getElementById('task-log');
            logDiv.innerHTML = '';
        }
        
        function addLogEntry(message, type) {
            const logDiv = document.getElementById('task-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
