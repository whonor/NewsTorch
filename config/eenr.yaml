# English MIND-small + English WikiEvents supervision; title/abstract adaptation.
model: EENR
dataset_name: mind
mind_split_protocol: newstorch
event_text_source: title_abstract
seed: 42
epoch: 10
batch_size: 128
lr: 0.0001
weight_decay: 0.0
gradient_clip_norm: 4.0
negative_sample_num: 4
max_history_num: 50
max_title_length: 32
max_argument_length: 48
max_role_length: 16
semantic_dim: 128
word_embedding_dim: 300
category_embedding_dim: 50
event_embedding_dim: 50
attention_dim: 128
dropout_rate: 0.2
max_events: 4
extractor_backend: xlmr_bilstm_crf
extractor_supervision_language: en
extractor_checkpoint: artifacts/eenr/extractor_xlmr_wikievents_seed42/best.pt
extractor_device: cuda
extractor_batch_size: 8
extractor_body_chars: 6000
word_vector_model: en_core_web_md
node2vec_p: 1.0
node2vec_q: 0.5
node2vec_walk_length: 20
node2vec_walks: 40
node2vec_epochs: 20
threads: 4
