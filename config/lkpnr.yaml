
category_embedding_dim: 50
subCategory_embedding_dim: 50
entity_attention_dim: 100
pretrain_emb_d: 4096
pretrain_rep_d: 500
pretrain_hidden_dim: 1024
entity_hidden_dim: 256
entity_att_head_num: 3
max_linked_entity_length: 20
head_num: 20
head_dim: 20
attention_dim: 200
# "auto" keeps the original KGraph_LKPNR assets for MIND when present and
# uses dataset-native semantic/entity features for EB-NeRD and Adressa.
lkpnr_knowledge_mode: auto
# Optional dense .npy generated by scripts/generate_lkpnr_embeddings.py.
lkpnr_semantic_embedding_path: ""
# Set true for benchmark runs to disallow the pretrained-text pooling fallback.
lkpnr_require_semantic_cache: false
