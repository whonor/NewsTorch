hidden_size: 256
attention_dim: 256

# Public Hugging Face model ID or local Qwen3 directory. ONCE_QWEN_MODEL can
# override this value without modifying the configuration file.
once_qwen_model_name_or_path: "Qwen/Qwen3-0.6B"
once_hf_token_env: "HF_TOKEN"
once_cache_key: "qwen3_0.6b"
once_cache_dir: "cache/once_dire_qwen3_naml"
once_cache_dtype: "float16"
once_max_length: 64
once_item_page_size: 16
once_forward_page_size: 32

# Cache through Qwen3's penultimate decoder block and fine-tune the final block.
once_tune_from: -2
once_dtype: "bfloat16"
once_trust_remote_code: false
once_local_files_only: false

once_use_lora: true
once_lora_r: 32
once_lora_alpha: 128
once_lora_dropout: 0.1
once_lora_target_modules: ["q_proj", "v_proj"]
